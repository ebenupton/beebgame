# The Model B (build.sh, BHW=1): one assembly, the fixed pieces of four bank images.
# Main RAM below $0300 is zero page, the stack and the low RAM (low.s); $0300-$7FFF
# is the display (engine.s: the bar, two 23-slot rings, 21 rows visible).  While a
# level loads the display is the loader's staging area (ldprog.s).
#
# Every level's data is loaded into the banks by the game's own loader, so only the
# code and the static tables are linked here, each fixed region to its own file;
# build.sh gathers them into BANKS with a piece table for the boot loader.  Code sits
# at the BOTTOM of banks 4, 5 and 6 (each entered at $8000) and the level's data runs
# from its end: the bounds are the game's assets.inc B4_CODE_END and B5_CODE_END (engine.s
# asserts them) and defs.inc TILES.  TILEMIRROR=1 widens B6X and
# B5X (build.sh edits the copy it links with).
#
# Bank 7 is the kernel at its top (B7K, resident: what the menus and the game both
# call) and below it one of two images, the game's (B7D, B7B, B7: the file GAME) or the
# menus' (B7M: MENU), each read from the disc over the other (disc.s go_game,
# go_menu); start-up reads the menus' (go_title).
MEMORY {
    ZP:      start = $0000, size = $00F0, type = rw, define = yes;   # the engine's (ZEROPAGE, ZPHW), then the game's (ZPGAME)
    MOSZP0:  start = $00F0, size = $0004, type = rw, define = yes;   # the MOS's zero page the game may use: not $F4
    MOSZP5:  start = $00F5, size = $0007, type = rw, define = yes;   #   (ROMSEL's copy) or $FC (the interrupt entry's A)
    MOSZPD:  start = $00FD, size = $0003, type = rw, define = yes;
    LOWBS:   start = $0140, size = $00C4, type = rw, define = yes;   # $0140-$0203
    LOWRAM:  start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF, clear of IRQ1V
    B4X:     start = $8000, size = $0400, type = ro, file = "build/b4x.bin", fill = no;   # the row loop, entered at $8000 (BANKENTRY)
    B4T:     start = $BB00, size = $0500, type = ro, file = "build/b4t.bin", fill = yes;  # SWAPTAB, MASKTAB0-3: to the end of the bank
    B6X:     start = $8000, size = $0700, type = rw, file = "build/b6x.bin", fill = no;   # bank6_entry + drawrect_clip at $8000 (BANKENTRY), the tile blitter, its variables
    B5X:     start = $8000, size = $0300, type = rw, file = "build/b5x.bin", fill = no;   # the row loop, entered at $8000 (BANKENTRY); gather5
    B5T:     start = $BC00, size = $0400, type = ro, file = "build/b5t.bin", fill = yes;  # MASKTAB0-3: to the end of the bank
    BOOTRAM: start = $7000, size = $0800, type = rw, file = "build/boot.bin", fill = no;  # start-up and the low-RAM image: main RAM (init.s), overwritten by play
    B7D:     start = $8000, size = $0220, type = rw, file = "",              fill = no;   # the level's tables (loaded): the start of bank 7
    B7B:     start = $8300, size = $3400, type = rw, file = "",              fill = no;   # the game's image's variables: the game's, then the engine's
    B7:      start = $9000, size = $2700, type = rw, file = "build/b7.bin",  fill = no, define = yes;   # the game's image (GAME): the game's code, then the engine's, ending at the kernel (build.sh sets start and size)
    B7M:     start = $8000, size = $3700, type = rw, file = "build/MENU",    fill = no, define = yes;   # the menus' image (MENU): the menus, the tune, the font, the title pieces
    B7K:     start = $B700, size = $0700, type = rw, file = "build/b7k.bin", fill = no;   # resident: what the menus and the game both need (the kernel), never swapped (build.sh sets start and size)
    DRV8271: start = $BE00, size = $0100, type = rw, file = "build/drv8271.bin", fill = no, define = yes;   # the driver slot, up against KRNHW: the 8271's driver,
    DRV1770: start = $BE00, size = $0100, type = rw, file = "build/drv1770.bin", fill = no, define = yes;   #   or the 1770's (the boot loader copies in one: disc.s; build.sh sets start and size)
    B7H:     start = $BF00, size = $0100, type = rw, file = "",              fill = no;   # the kernel's machine-dependent variables, last
    NMI8271: start = $0D00, size = $00FD, type = rw, file = "",              fill = no;   # the driver's NMI stub runs here (disc.s): the 8271's,
    NMI1770: start = $0D00, size = $00FD, type = rw, file = "",              fill = no;   #   or the 1770's (the page's last three bytes are its state)
    BFX:     start = $0000, size = $0400, type = ro, file = "build/bankfix.bin", fill = no; # the bank-number patch list (cpu.inc BANKREF): appended to BANKS
    WFX:     start = $0000, size = $0400, type = ro, file = "build/wrfix.bin",   fill = no; # the write-bank store list (cpu.inc wrsel): appended after it
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    ZPHW:     load = ZP,     type = zp,    optional = yes;   # one machine's own, after the engine's shared: the game's is pinned past it
    ZPGAME:   load = ZP,     type = zp,    define = yes;
    ZPF0:     load = MOSZP0,  type = zp,    define = yes;
    ZPF5:     load = MOSZP5,  type = zp,    define = yes;
    ZPFD:     load = MOSZPD,  type = zp,    define = yes;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    LOWHW:    load = LOWBS,  type = bss,   optional = yes;   # one machine's own, last
    SPR4SWAP: load = B4T,    type = ro;
    SPR4MASK: load = B4T,    type = ro;
    SPR4CODE: load = B4X,    type = ro,    define = yes;
    TIL6ENT:  load = B6X,    type = ro;                               # bank6_entry + drawrect_clip
    TILCODE:  load = B6X,    type = ro,    define = yes;
    TILBSS:   load = B6X,    type = bss,   define = yes;
    BOOTHDR:  load = BOOTRAM, type = rw;                              # the loader's header and the entry (init.s): $7000, $7007
    BOOT:     load = BOOTRAM, type = rw,  define = yes;             # start-up (init.s): run where loaded
    LOWCODE:  load = BOOTRAM, run = LOWRAM, type = rw, define = yes;  # copied down by boot
    LOWBSS2:  load = LOWRAM, type = bss,   define = yes;              # GATHERL, above the low code
    SPR5MASK: load = B5T,    type = ro;
    SPR5CODE: load = B5X,    type = ro,    define = yes;
    MAP5CODE: load = B5X,    type = ro,    define = yes;              # the gather (gather5)
    MAP5BSS:  load = B5X,    type = bss,   define = yes;              # its shape (the loader's)
    ENGLVL:   load = B7D,    type = bss,   define = yes, align = $100;  # attr, altcls, hdr
    GAMEDATA: load = B7,     type = ro,    define = yes;
    GAMECODE: load = B7,     type = ro,    define = yes;
    ENGCODE:  load = B7,     type = ro,    define = yes;              # the engine's bank 7 half, up against the kernel
    MUSCODE:  load = B7M,    type = ro,    define = yes;              # the engine's music player, first in the menus' image
    MNUCODE:  load = B7M,    type = ro,    define = yes;
    MNUDATA:  load = B7M,    type = ro,    define = yes;
    MNUBSS:   load = B7M,    type = bss,   define = yes;
    GAMEBSS:  load = B7B,    type = bss,   define = yes, align = $100;   # page aligned: its tables' page crossings do not move with the code
    ENGBSS:   load = B7B,    type = bss,   define = yes, align = $100;   # the engine's: the sprite directory, SPRMASK, the records, the dirty lists
    KRNDATA:  load = B7K,    type = ro,    define = yes;              # the kernel's tables, first: they lie alike on both machines
    KRNCODE:  load = B7K,    type = ro,    define = yes;              # the kernel: the chain's builders, the palette, the keys and sound, the disc
    KRNBSS:   load = B7K,    type = bss,   define = yes;
    D8271H:   load = DRV8271, type = ro;                              # a driver: the jmp to its track read, its stub's length,
    D8271N:   load = DRV8271, run = NMI8271, type = ro;               #   its NMI stub (copied to NMIPAGE by disc_boot),
    D8271C:   load = DRV8271, type = ro;                              #   its code (disc.s)
    D1770H:   load = DRV1770, type = ro;
    D1770N:   load = DRV1770, run = NMI1770, type = ro;
    D1770C:   load = DRV1770, type = ro;
    KRNHW:    load = B7H,    type = bss,   optional = yes;   # one machine's own, last; page aligned: the Model B's SECTAB (the chain step's table) in one page
    BANKFIX:  load = BFX,    type = ro;
    WRFIX:    load = WFX,    type = ro;
}
