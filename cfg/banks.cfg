# banks.cfg -- one linker map for both machines (tools/build.sh: BHW=1 the Model B,
# BHW=0 the Master): one assembly, the fixed pieces of four bank images.
#
# Main RAM below $0300 is zero page, the stack and the low RAM (low.s) on both.  The
# Model B's $0300-$7FFF is the display (engine/defs.s: the bar, two 23-slot rings
# with their mirrors, 21 rows visible); the Master's holds the level's tile table
# LV_PAGE0 at $0400, its interrupt handler, chain step, keys and sound at $0600
# (MRAM) and their state at $0C00 (MRAMB), the level's objects at $1C00, the bar at
# $2B00 and the 32-row ring at $3000-$7FFF in main and shadow RAM.  While a level
# loads the display is the loader's staging area (ldprog.s).  The Master's own areas
# (MRAM, MRAMB, HAZ) and segments (MRAMCODE, MRAMBSS, HAZ*) are empty in the Model
# B's link: cpu.inc PLACEH puts the handler's work in KRNCODE/KRNHW there, so they
# are optional, and an empty area with a file writes an empty file build.sh does not
# read (mcode.bin is a BANKS piece for the Master alone, hazel.bin for GAMEHAZEL).
#
# Every level's data is loaded into the banks by the game's own loader, so only the
# code and the static tables are linked here, each fixed region to its own file;
# build.sh gathers them into BANKS with a piece table for the boot loader.  Code
# sits at the BOTTOM of banks 4, 5 and 6 (each entered at $8000) and the level's
# data runs from the Model B's code ends (the game's assets.inc: B4_CODE_END,
# B5_CODE_END), which the Master's code may fall short of but not pass
# (engine/sprloops.s and gather.s assert it), and defs.inc TILES.
#
# Bank 7 is the kernel at its top (B7K, resident: what the menus and the game both
# call) and below it one of two images, the game's (B7D, B7B, B7: the file GAME,
# build.sh's copy of b7.bin) or the menus' (B7M: MENU), each read from the disc over
# the other (disc.s go_game, go_menu); start-up reads the menus' (go_title).
#
# What build.sh sets here before each link (sed, on its copy of this file):
#   - B4X, B5X, B6X sizes from the game's assets.inc: the sprite banks' code must end
#     exactly where the packer starts their sprites (B4_CODE_END, B5_CODE_END), bank
#     6's before the first tile slot (TILES + (TOFF+1)*TILEBYTES), so an overflow fails
#     the link rather than corrupting a level's data;
#   - B7 (the game's image), B7M (the menus'), B7K (the kernel) and the driver slot:
#     ld65 fills an area from its START, and these must END at fixed places -- the
#     KRNHW (and GAMEHI) at B7H ending at $BFFF, the kernel against it (KRNDATA after
#     its code, in KRNHW's page), the driver slot against the kernel, the images against
#     the slot -- so build.sh takes the segments' sizes from the object file
#     (od65) and computes each start downward from $C000.  ld65 has no end-aligned
#     placement; the arithmetic lives in build.sh and the values here are placeholders.
# Every area with define = yes gives __NAME_START__/__NAME_SIZE__ to the sources,
# which assert their own equates against them (defs.inc, disc.s, init.s), and to
# build.sh.  The Master's link is this file pinned to the Model B's segment starts
# (tools/pincfg.py), so the data lies alike on both.
MEMORY {
    ZP:      start = $0000, size = $00FC, type = rw, define = yes;   # zero page: the engine's (ZEROPAGE), then the game's (ZPGAME), alike on
                                                                     #  both machines; $FC is the ROM's interrupt entry's (it keeps A there)
    ZPEND:   start = $00FD, size = $0003, type = rw, define = yes;   # and the last three: ROMSEL_CPY first
    LOWBS:   start = $0140, size = $00C4, type = rw, define = yes;   # $0140-$0203
    LOWRAM:  start = $0206, size = $00FA, type = rw, define = yes;   # $0206-$02FF, clear of IRQ1V
    B4X:     start = $8000, size = $0600, type = ro, file = "build/b4x.bin", fill = no, define = yes;   # the row loop, entered at $8000 (BANKENTRY); build.sh sets the size: B4_CODE_END
    B4T:     start = $BC00, size = $0400, type = ro, file = "build/b4t.bin", fill = yes, define = yes;  # L0TAB, L1TAB, NMASK, SWAPTAB: to the end of the bank
    B6X:     start = $8000, size = $0700, type = rw, file = "build/b6x.bin", fill = no, define = yes;   # bank6_entry + draw_rect_clip at $8000 (BANKENTRY), the tile blitter, its variables; build.sh sets the size: the first tile slot
    B5X:     start = $8000, size = $0600, type = rw, file = "build/b5x.bin", fill = no, define = yes;   # the row loop, entered at $8000 (BANKENTRY); gather5; build.sh sets the size: B5_CODE_END
    B5T:     start = $BC00, size = $0400, type = ro, file = "build/b5t.bin", fill = yes, define = yes;  # L0TAB, L1TAB, NMASK, SWAPTAB: to the end of the bank
    BOOTRAM: start = $7000, size = $0800, type = rw, file = "build/boot.bin", fill = no, define = yes;  # start-up and the low-RAM image: main RAM (init.s), overwritten by play
    B7D:     start = $8000, size = $0300, type = rw, file = "",              fill = no;   # the level's tables (loaded): the start of bank 7; then the game's page-bound tables (GAMELVL)
    B7B:     start = $8300, size = $3400, type = rw, file = "",              fill = no;   # the game's image's variables: the game's, then the engine's
    B7:      start = $9000, size = $2700, type = rw, file = "build/b7.bin",  fill = no, define = yes;   # the game's image (GAME): the game's code, then the engine's, ending at the kernel (build.sh sets start and size)
    B7M:     start = $8000, size = $3700, type = rw, file = "build/MENU",    fill = no, define = yes;   # the menus' image (MENU): the menus, the tune, the font, the title pieces (build.sh sets the size)
    B7K:     start = $B700, size = $0700, type = rw, file = "build/b7k.bin", fill = no;   # resident: what the menus and the game both need (the kernel), never swapped (build.sh sets start and size)
    DRV8271: start = $BE00, size = $0100, type = rw, file = "build/drv8271.bin", fill = no, define = yes;   # the driver slot, under the kernel: the 8271's driver,
    DRV1770: start = $BE00, size = $0100, type = rw, file = "build/drv1770.bin", fill = no, define = yes;   #   or the 1770's (the boot loader copies in one: disc.s; build.sh sets start and size)
    B7H:     start = $BF00, size = $0100, type = rw, file = "",              fill = no, define = yes;   # the kernel's machine-dependent variables (and GAMEHI), last: ending at $BFFF
    NMI8271: start = $0D00, size = $00FD, type = rw, file = "",              fill = no, define = yes;   # the driver's NMI stub runs here (defs.inc NMIPAGE): the 8271's,
    NMI1770: start = $0D00, size = $00FD, type = rw, file = "",              fill = no, define = yes;   #   or the 1770's (the page's last three bytes are its state)
    LDP:     start = $0E00, size = $0E00, type = rw, file = "",              fill = no, define = yes;   # the load-time program (ldprog.cfg links it here: defs.inc LDPROG); no segment of this link
    BANKSB:  start = $2000, size = $5000, type = rw, file = "",              fill = no, define = yes;   # where the boot loader reads BANKS, below BOOTRAM (defs.inc BANKSBUF); no segment of this link
    MRAM:    start = $0600, size = $0600, type = rw, file = "build/mcode.bin", fill = no, define = yes; # the Master's handler, chain step, keys, sound (empty on the Model B)
    MRAMB:   start = $0C00, size = $0100, type = rw, file = "",              fill = no, define = yes;   # and their state: the chain tables (init.s zeroes it)
    HAZ:     start = $C000, size = $2000, type = rw, file = "build/hazel.bin", fill = no, define = yes; # HAZEL: the game's own code (GAMEHAZEL), a BANKS piece
    BFX:     start = $0000, size = $0400, type = ro, file = "build/bankfix.bin", fill = no; # the bank-number patch list (cpu.inc BANKREF): appended to BANKS
    WFX:     start = $0000, size = $0400, type = ro, file = "build/wrfix.bin",   fill = no; # the write-bank store list (cpu.inc wrsel): appended after it
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    ZPGAME:   load = ZP,     type = zp,    define = yes;
    ZPTOP:    load = ZPEND,  type = zp,    define = yes;
    LOWBSS:   load = LOWBS,  type = bss,   define = yes;
    LOWHW:    load = LOWBS,  type = bss,   optional = yes;   # one machine's own, last (the Model B's mirror notes)
    SPR4TAB:  load = B4T,    type = ro;
    SPR4CODE: load = B4X,    type = ro,    define = yes;
    TIL6ENT:  load = B6X,    type = ro;                               # bank6_entry + draw_rect_clip
    TILCODE:  load = B6X,    type = ro,    define = yes;
    SND6CODE: load = B6X,    type = ro,    define = yes, optional = yes;   # (SOUND6) the sound effects player (sound6.s) and the game's effects
    TILBSS:   load = B6X,    type = bss,   define = yes;
    BOOTHDR:  load = BOOTRAM, type = rw;                              # the loader's header and the entry (init.s): $7000, $7007
    BOOT:     load = BOOTRAM, type = rw,  define = yes;             # start-up (init.s): run where loaded
    LOWCODE:  load = BOOTRAM, run = LOWRAM, type = rw, define = yes;  # copied down by boot
    LOWCODE2: load = BOOTRAM, run = LOWBS, type = rw, define = yes, optional = yes;  # (SOUND6: snd_write) copied down by boot, after the variables
    LOWBSS2:  load = LOWRAM, type = bss,   define = yes, optional = yes;   # GATHERL, above the low code (SOUND6: in LOWBSS)
    SPR5TAB:  load = B5T,    type = ro;
    SPR5CODE: load = B5X,    type = ro,    define = yes;
    MAP5CODE: load = B5X,    type = ro,    define = yes;              # the gather (gather5)
    MAP5BSS:  load = B5X,    type = bss,   define = yes;              # its shape (the loader's)
    ENGLVL:   load = B7D,    type = bss,   define = yes, align = $100;  # attr, altcls, hdr
    GAMELVL:  load = B7D,    type = bss,   define = yes, optional = yes;   # the game's: filled at a level's start, in the room before B7B (224 bytes)
    GAMEDATA: load = B7,     type = ro,    define = yes;
    GAMECODE: load = B7,     type = ro,    define = yes;
    ENGCODE:  load = B7,     type = ro,    define = yes;              # the engine's bank 7 half, up against the kernel
    MUSCODE:  load = B7M,    type = ro,    define = yes;              # the engine's music player, first in the menus' image
    MNUCODE:  load = B7M,    type = ro,    define = yes;
    MNUDATA:  load = B7M,    type = ro,    define = yes;
    MNUBSS:   load = B7M,    type = bss,   define = yes, optional = yes;
    GAMEBSS:  load = B7B,    type = bss,   define = yes, align = $100;   # page aligned: the game's small variables (under 128 bytes)
    GAMEROWH: load = B7B,    type = bss,   define = yes, align = $80;    # the game's half-page table (Cleo's MROWH), in one page
    GAMEOBJ:  load = B7B,    type = bss,   define = yes, align = $100;   # the game's page-aligned arrays (Cleo's object state)
    ENGBSS:   load = B7B,    type = bss,   define = yes, align = $100;   # the engine's: the dirty lists, the records, the sprite list, the directory
    KRNCODE:  load = B7K,    type = ro,    define = yes;              # the kernel: the chain's builders, the palette, the keys and sound, the disc
    KRNDATA:  load = B7K,    type = ro,    define = yes;              # the kernel's tables, after its code: in KRNHW's page (build.sh)
    KRNBSS:   load = B7K,    type = bss,   define = yes;
    D8271H:   load = DRV8271, type = ro;                              # a driver: the jmp to its track read, its stub's length,
    D8271N:   load = DRV8271, run = NMI8271, type = ro;               #   its NMI stub (copied to NMIPAGE by every load: disc.s ld_go),
    D8271C:   load = DRV8271, type = ro;                              #   its code (disc.s)
    D1770H:   load = DRV1770, type = ro;
    D1770N:   load = DRV1770, run = NMI1770, type = ro;
    D1770C:   load = DRV1770, type = ro;
    KRNHW:    load = B7H,    type = bss,   optional = yes;   # one machine's own, last; page aligned: the Model B's SECTAB (the chain step's table) in one page
    GAMEHI:   load = B7H,    type = bss,   define = yes, optional = yes;   # the game's, after KRNHW: resident, filled at a level's start (optional)
    MRAMCODE: load = MRAM,   type = ro,    define = yes, optional = yes;   # the Master's own, by hardware (cpu.inc PLACEH; empty on the Model B)
    MRAMBSS:  load = MRAMB,  type = bss,   define = yes, optional = yes;
    HAZCODE:  load = HAZ,    type = ro,    optional = yes, define = yes;   # (GAMEHAZEL: the game's, in HAZEL)
    HAZDATA:  load = HAZ,    type = ro,    optional = yes, define = yes;
    HAZBSS:   load = HAZ,    type = bss,   optional = yes, define = yes;
    BANKFIX:  load = BFX,    type = ro;
    WRFIX:    load = WFX,    type = ro,    optional = yes;   # (the Model B's; no board on the Master: empty)
}
