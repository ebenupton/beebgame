# The load-time program (ldprog.s): read to $0E00 (defs.inc LDPROG, asserted equal
# there) by disc.s, run there; its end is where the Master's LV_OBJS begins (defs.inc).
# The Model B's STAGE follows it at $1800: ldprog.s asserts it ends by then (2.5K).
MEMORY {
    LD: start = $0E00, size = $0E00, type = rw, file = %O, fill = no, define = yes;
}
SEGMENTS {
    CODE: load = LD, type = ro;
    LDGAME: load = LD, type = ro, optional = yes;   # GAMELDINIT: the game's level start (ldprog.s ld_game)
}
